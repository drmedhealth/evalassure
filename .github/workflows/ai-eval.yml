# Run the AI evaluation suite on every pull request and block merges on critical findings.
name: ai-evaluation
on: [pull_request, workflow_dispatch]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,portal]"
      - run: pytest -q
      # Regression gate: fail the build if any HIGH or CRITICAL finding remains in the fixed workflow
      - run: evalassure run scenarios/14_automation_invoice_v2_regression.yaml --fail-on high --no-autofix
      # Full audit of all offline scenarios (reports uploaded as an artifact)
      - run: evalassure run-all scenarios -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ai-eval-reports, path: reports/}
      # Live LLM evaluation (only when the secret is configured)
      - if: env.ANTHROPIC_API_KEY != ''
        run: pip install anthropic && evalassure run scenarios/11_llm_claude_live.yaml --fail-on critical
