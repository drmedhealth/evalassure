[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitesteval"
version = "1.0.0"
description = "Test, evaluate, audit (compliance), troubleshoot and auto-fix AI/ML models, LLM apps and AI automations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
claude = ["anthropic"]
sklearn = ["scikit-learn"]
portal = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9",
          "cryptography>=42", "anthropic"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
aitesteval = "aitesteval.cli:main"
aitesteval-portal = "portal.__main__:main"

[tool.setuptools.packages.find]
include = ["aitesteval*", "portal*"]

[tool.setuptools.package-data]
portal = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
